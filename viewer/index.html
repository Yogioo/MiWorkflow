<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiWorkflow 运行视图</title>
<style>
  :root { --bg:#0f1115; --panel:#161a21; --line:#242a34; --fg:#e6e9ef; --dim:#8b93a3;
          --ok:#3fb950; --bad:#f85149; --wait:#d29922; --run:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; }
  #conn { margin-left:auto; font-size:12px; color:var(--dim); }
  main { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 49px); }
  aside { border-right:1px solid var(--line); overflow:auto; padding:8px; }
  section { overflow:auto; padding:16px 20px 60px; }
  .run { padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
  .run:hover { background:var(--panel); }
  .run.on { background:var(--panel); border-color:var(--line); }
  .run .t { font-weight:600; font-size:13px; word-break:break-all; }
  .run .m { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--dim); }
  .dot.ok{background:var(--ok)} .dot.failed{background:var(--bad)}
  .dot.waiting{background:var(--wait)} .dot.running{background:var(--run)}
  ol { list-style:none; margin:0; padding:0; }
  li { display:grid; grid-template-columns:48px 78px 1fr; gap:10px; padding:9px 0;
       border-bottom:1px solid var(--line); align-items:start; }
  .sq { color:var(--dim); font:12px ui-monospace,Consolas,monospace; }
  .badge { font-size:11px; text-align:center; padding:2px 0; border-radius:5px;
           background:var(--panel); color:var(--dim); border:1px solid var(--line); }
  .badge.ok{color:var(--ok);border-color:#1f4023}
  .badge.failed{color:var(--bad);border-color:#4a1f1f}
  .badge.pending{color:var(--wait);border-color:#4a3a12}
  .badge.running{color:var(--run);border-color:#1c3a5c}
  .say { font-size:14.5px; }
  .meta { color:var(--dim); font-size:11.5px; margin-top:3px; font-family:ui-monospace,Consolas,monospace; }
  .detail { color:var(--dim); font-size:12px; margin-top:4px; white-space:pre-wrap; }
  .card { border:1px solid #4a3a12; background:#1e1a0e; border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .card h3 { margin:0 0 6px; font-size:12.5px; color:var(--wait); font-weight:600; }
  .card p { margin:0 0 12px; font-size:15px; }
  button { font:inherit; padding:6px 18px; border-radius:7px; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); cursor:pointer; }
  button.yes { background:#1f4023; border-color:#2d6a34; }
  button.no { margin-left:8px; }
  button:disabled { opacity:.45; cursor:default; }
  .empty { color:var(--dim); }
  aside h2 { font-size:11.5px; color:var(--dim); font-weight:600; margin:8px 10px 6px; letter-spacing:.5px; }
  .task { padding:8px 10px; border-radius:8px; margin-bottom:4px; background:var(--panel); }
  .task .t { font-weight:600; font-size:13px; word-break:break-all; }
  .task .m { color:var(--dim); font-size:11.5px; margin:2px 0 6px; }
  .task .row { display:flex; gap:6px; }
  .task input { flex:1; min-width:0; font:12px ui-monospace,Consolas,monospace; padding:4px 6px;
                border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .task button { padding:4px 12px; background:#1c3a5c; border-color:#2a5a8c; }
  .task.busy button { opacity:.45; }
  .task.busy .m::after { content:' · 在跑'; color:var(--run); }
</style>
</head>
<body>
<header>
  <h1>MiWorkflow</h1>
  <span id="conn">连接中…</span>
</header>
<main>
  <aside>
    <h2>任务</h2>
    <div id="tasks"></div>
    <h2>运行记录</h2>
    <div id="runs"></div>
  </aside>
  <section>
    <div id="pending"></div>
    <ol id="timeline"></ol>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const time = (iso) => iso ? new Date(iso).toLocaleTimeString('zh-CN', { hour12:false }) : '';

let runs = [];
let tasksKey = '';   // 任务列表没变就不重画，免得冲掉输入框里的参数
let cur = null;      // 当前 runId
let offset = 0;      // 已读字节
let records = [];
const decided = new Set();

function pendingList() {
  const pend = new Map();
  for (const r of records) {
    if (r.primitive !== 'human') continue;
    if (r.status === 'pending') pend.set(r.seq, r);
    else if (r.ref != null) pend.delete(r.ref);
  }
  return [...pend.values()].filter((p) => !decided.has(p.seq));
}

function renderRuns() {
  $('#runs').innerHTML = runs.map((r) => `
    <div class="run ${r.runId === cur ? 'on' : ''}" data-id="${esc(r.runId)}">
      <div class="t"><span class="dot ${esc(r.status)}"></span>${esc(r.title)}</div>
      <div class="m">${time(r.startedAt)} · ${esc(r.status)}${r.pending ? ' · 待决定 ' + r.pending : ''}</div>
    </div>`).join('') || '<div class="empty">还没有运行记录</div>';
}

function renderTasks(list) {
  const key = JSON.stringify(list);
  if (key !== tasksKey) {
    tasksKey = key;
    $('#tasks').innerHTML = list.map((t) => `
      <div class="task" data-task="${esc(t.name)}">
        <div class="t">${esc(t.title)}</div>
        <div class="m">${esc(t.name)}</div>
        <div class="row">
          <input placeholder="--key value" spellcheck="false" />
          <button data-run="${esc(t.name)}">运行</button>
        </div>
      </div>`).join('') || '<div class="empty">tasks/ 里还没有任务</div>';
  }
  // 同一任务在跑只是提示，不是锁：进程被杀掉的 run 会一直显示在跑
  const busy = new Set(runs.filter((r) => r.status === 'running' || r.status === 'waiting').map((r) => r.task));
  for (const el of document.querySelectorAll('.task')) el.classList.toggle('busy', busy.has(el.dataset.task));
}

// 与 run.mjs 同规则：--key value / --key=value / --flag
function parseArgs(text) {
  const out = {};
  const toks = text.trim().split(/\s+/).filter(Boolean);
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (!t.startsWith('--')) continue;
    const eq = t.indexOf('=');
    if (eq > 2) { out[t.slice(2, eq)] = t.slice(eq + 1); continue; }
    const next = toks[i + 1];
    out[t.slice(2)] = next && !next.startsWith('--') ? toks[++i] : true;
  }
  return out;
}

async function runTask(btn) {
  const box = btn.closest('.task');
  if (box.classList.contains('busy') && !confirm('这个任务已经在跑了，再起一次？')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ task: btn.dataset.run, args: parseArgs(box.querySelector('input').value) })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error === 'local_only' ? '只有本机能起任务（viewer 设 MIWORKFLOW_REMOTE_RUN=1 放开）' : `起不来：${data.error}`);
      return;
    }
    await select(data.runId);
  } finally {
    btn.disabled = false;
  }
}

function renderPending() {
  $('#pending').innerHTML = pendingList().map((p) => `
    <div class="card">
      <h3>需要你决定 · seq ${p.seq} · ${time(p.at)}</h3>
      <p>${esc(p.prompt)}</p>
      <button class="yes" data-seq="${p.seq}" data-d="ok">通过</button>
      <button class="no" data-seq="${p.seq}" data-d="skipped">拒绝</button>
    </div>`).join('');
}

function renderTimeline() {
  if (!records.length) { $('#timeline').innerHTML = '<li class="empty">等待中…</li>'; return; }
  $('#timeline').innerHTML = records.map((r) => {
    const detail = [r.reason, r.error].filter(Boolean).join('\n');
    const meta = [r.name, r.status, r.durationMs != null ? r.durationMs + 'ms' : null, time(r.at)]
      .filter(Boolean).map(esc).join(' · ');
    return `<li>
      <span class="sq">${r.seq ?? ''}</span>
      <span class="badge ${esc(r.status ?? '')}">${esc(r.primitive ?? '')}</span>
      <div>
        <div class="say">${esc(r.say ?? '')}</div>
        <div class="meta">${meta}</div>
        ${detail ? `<div class="detail">${esc(detail)}</div>` : ''}
      </div>
    </li>`;
  }).join('');
}

async function select(id) {
  cur = id; offset = 0; records = []; decided.clear();
  renderRuns(); renderTimeline(); renderPending();
  await pump();
}

async function pump() {
  if (!cur) return;
  try {
    const res = await fetch(`/api/run/${encodeURIComponent(cur)}?from=${offset}`);
    const data = await res.json();
    offset = data.next;
    if (data.records.length) {
      records.push(...data.records);
      renderTimeline(); renderPending();
    }
    $('#conn').textContent = '已连接 · ' + new Date().toLocaleTimeString('zh-CN', { hour12:false });
  } catch {
    $('#conn').textContent = '连接断开';
  }
}

async function tick() {
  try {
    runs = await (await fetch('/api/runs')).json();
    renderRuns();
    renderTasks(await (await fetch('/api/tasks')).json());
    if (!cur && runs.length) await select(runs[0].runId);
  } catch {
    $('#conn').textContent = '连接断开';
  }
}

document.addEventListener('click', async (e) => {
  const go = e.target.closest('button[data-run]');
  if (go) return runTask(go);
  const btn = e.target.closest('button[data-seq]');
  if (btn) {
    btn.disabled = true;
    await fetch('/api/decide', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ runId: cur, seq: Number(btn.dataset.seq), decision: btn.dataset.d })
    });
    decided.add(Number(btn.dataset.seq));
    renderPending();
    return;
  }
  const item = e.target.closest('.run');
  if (item && item.dataset.id !== cur) await select(item.dataset.id);
});

setInterval(tick, 2000);
setInterval(pump, 1000);
tick();
</script>
</body>
</html>
