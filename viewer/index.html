<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiWorkflow 运行视图</title>
<style>
  :root { --bg:#0f1115; --panel:#161a21; --line:#242a34; --fg:#e6e9ef; --dim:#8b93a3;
          --ok:#3fb950; --bad:#f85149; --wait:#d29922; --run:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; }
  .opt { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--dim); cursor:pointer; user-select:none; }
  .opt input { accent-color:var(--run); margin:0; }
  #conn { margin-left:auto; font-size:12px; color:var(--dim); }
  main { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 49px); }
  aside { border-right:1px solid var(--line); overflow:auto; padding:8px; }
  section { overflow:auto; padding:16px 20px 60px; }
  .run { padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
  .run:hover { background:var(--panel); }
  .run.on { background:var(--panel); border-color:var(--line); }
  .run .t { font-weight:600; font-size:13px; word-break:break-all; }
  .run .m { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--dim); }
  .dot.ok{background:var(--ok)} .dot.failed{background:var(--bad)}
  .dot.waiting{background:var(--wait)} .dot.running{background:var(--run)}
  ol { list-style:none; margin:0; padding:0; }
  li { display:grid; grid-template-columns:48px 78px 1fr; gap:10px; padding:9px 0;
       border-bottom:1px solid var(--line); align-items:start; cursor:pointer; }
  li.resolved .say { color:var(--dim); }
  .chev { color:var(--dim); font-size:10px; margin-right:5px; }
  .pill { font-size:10.5px; padding:1px 7px; border-radius:999px; margin-left:7px;
          border:1px solid var(--line); color:var(--dim); vertical-align:1px; }
  .pill.running { color:var(--run); border-color:#1c3a5c; }
  .sq { color:var(--dim); font:12px ui-monospace,Consolas,monospace; }
  .badge { font-size:11px; text-align:center; padding:2px 0; border-radius:5px;
           background:var(--panel); color:var(--dim); border:1px solid var(--line); }
  .badge.ok{color:var(--ok);border-color:#1f4023}
  .badge.failed{color:var(--bad);border-color:#4a1f1f}
  .badge.pending{color:var(--wait);border-color:#4a3a12}
  .badge.running{color:var(--run);border-color:#1c3a5c}
  .say { font-size:14.5px; }
  .meta { color:var(--dim); font-size:11.5px; margin-top:3px; font-family:ui-monospace,Consolas,monospace; }
  .detail { color:var(--dim); font-size:12px; margin-top:4px; white-space:pre-wrap; }
  .evt { margin-top:6px; }
  .evt button { padding:1px 8px; font-size:11.5px; background:transparent; color:var(--dim); border-color:var(--line); }
  .evt button:hover { color:var(--fg); }
  .evt-body { margin:6px 0 2px 4px; padding:2px 0 2px 10px; border-left:2px solid var(--line); font-size:12.5px; }
  .evt-body .line { white-space:pre-wrap; word-break:break-word; }
  .evt-body .l-res, .evt-body .l-thinking, .evt-body .evt-none { color:var(--dim); }
  .evt-body .l-thinking { font-style:italic; }
  .evt-body .l-error { color:var(--bad); }
  .evt-body details { color:var(--dim); margin-top:4px; }
  .evt-body summary { cursor:pointer; font-size:11.5px; }
  .evt-body pre { margin:4px 0 0; padding:6px 8px; background:var(--bg); border:1px solid var(--line);
                  border-radius:6px; overflow:auto; max-height:220px; font-size:11px; }
  .card { border:1px solid #4a3a12; background:#1e1a0e; border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .card h3 { margin:0 0 6px; font-size:12.5px; color:var(--wait); font-weight:600; }
  .card p { margin:0 0 12px; font-size:15px; }
  button { font:inherit; padding:6px 18px; border-radius:7px; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); cursor:pointer; }
  button.yes { background:#1f4023; border-color:#2d6a34; }
  button.no { margin-left:8px; }
  button:disabled { opacity:.45; cursor:default; }
  .empty { color:var(--dim); }
  aside h2 { font-size:11.5px; color:var(--dim); font-weight:600; margin:8px 10px 6px; letter-spacing:.5px; }
  .task { padding:8px 10px; border-radius:8px; margin-bottom:4px; background:var(--panel); }
  .task .t { font-weight:600; font-size:13px; word-break:break-all; }
  .task .m { color:var(--dim); font-size:11.5px; margin:2px 0 6px; }
  .task .row { display:flex; gap:6px; }
  .task input { flex:1; min-width:0; font:12px ui-monospace,Consolas,monospace; padding:4px 6px;
                border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .task button { padding:4px 12px; background:#1c3a5c; border-color:#2a5a8c; }
  .task.busy button { opacity:.45; }
  .task.busy .m::after { content:' · 在跑'; color:var(--run); }
</style>
</head>
<body>
<header>
  <h1>MiWorkflow</h1>
  <label class="opt"><input type="checkbox" id="expandAll" /> 默认展开</label>
  <span id="conn">连接中…</span>
</header>
<main>
  <aside>
    <h2>任务</h2>
    <div id="tasks"></div>
    <h2>运行记录</h2>
    <div id="runs"></div>
  </aside>
  <section>
    <div id="pending"></div>
    <ol id="timeline"></ol>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const time = (iso) => iso ? new Date(iso).toLocaleTimeString('zh-CN', { hour12:false }) : '';

let runs = [];
let tasksKey = '';   // 任务列表没变就不重画，免得冲掉输入框里的参数
let cur = null;      // 当前 runId
let offset = 0;      // 已读字节
let records = [];
const decided = new Set();
const agentEvents = new Map(); // seq → { open, items, next, loading, error, done }：展开过的步骤，重画不丢
const manual = new Map();      // seq → 手动展开(true)/收缩(false)；没点过的按全局默认

// 「默认展开 / 默认收缩」（§13.6）：存 localStorage，刷新后仍生效
const EXPAND_KEY = 'miworkflow.expand';
const store = typeof localStorage !== 'undefined' ? localStorage : null;
function readBool(key, dflt) { try { const v = store?.getItem(key); return v == null ? dflt : v === '1'; } catch { return dflt; } }
function writeBool(key, v) { try { store?.setItem(key, v ? '1' : '0'); } catch { /* 隐私模式等，忽略 */ } }
let expandAll = readBool(EXPAND_KEY, false); // 缺省收缩（§13.6）

// 没手动点过就按全局默认；点过就尊重手动状态（§13.6）
function isOpen(r) {
  return r && r.seq != null && manual.has(r.seq) ? manual.get(r.seq) : expandAll;
}

function setExpandAll(v) {
  expandAll = !!v;
  writeBool(EXPAND_KEY, expandAll);
  const box = $('#expandAll');
  if (box) box.checked = expandAll;
  renderTimeline();
}

// 终态行用 ref 指回进行中那条（§13.5 的重放机制）：被指过就不再是「进行中」
function isResolved(seq) {
  return records.some((r) => r.ref === seq);
}
function isActive(r) {
  return r?.primitive === 'agent' && r.status === 'running' && !isResolved(r.seq);
}

function pendingList() {
  const pend = new Map();
  for (const r of records) {
    if (r.primitive !== 'human') continue;
    if (r.status === 'pending') pend.set(r.seq, r);
    else if (r.ref != null) pend.delete(r.ref);
  }
  return [...pend.values()].filter((p) => !decided.has(p.seq));
}

function renderRuns() {
  $('#runs').innerHTML = runs.map((r) => `
    <div class="run ${r.runId === cur ? 'on' : ''}" data-id="${esc(r.runId)}">
      <div class="t"><span class="dot ${esc(r.status)}"></span>${esc(r.title)}</div>
      <div class="m">${time(r.startedAt)} · ${esc(r.status)}${r.pending ? ' · 待决定 ' + r.pending : ''}</div>
    </div>`).join('') || '<div class="empty">还没有运行记录</div>';
}

function renderTasks(list) {
  const key = JSON.stringify(list);
  if (key !== tasksKey) {
    tasksKey = key;
    $('#tasks').innerHTML = list.map((t) => `
      <div class="task" data-task="${esc(t.name)}">
        <div class="t">${esc(t.title)}</div>
        <div class="m">${esc(t.name)}</div>
        <div class="row">
          <input placeholder="--key value" spellcheck="false" />
          <button data-run="${esc(t.name)}">运行</button>
        </div>
      </div>`).join('') || '<div class="empty">tasks/ 里还没有任务</div>';
  }
  // 同一任务在跑只是提示，不是锁：进程被杀掉的 run 会一直显示在跑
  const busy = new Set(runs.filter((r) => r.status === 'running' || r.status === 'waiting').map((r) => r.task));
  for (const el of document.querySelectorAll('.task')) el.classList.toggle('busy', busy.has(el.dataset.task));
}

// 与 run.mjs 同规则：--key value / --key=value / --flag
function parseArgs(text) {
  const out = {};
  const toks = text.trim().split(/\s+/).filter(Boolean);
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (!t.startsWith('--')) continue;
    const eq = t.indexOf('=');
    if (eq > 2) { out[t.slice(2, eq)] = t.slice(eq + 1); continue; }
    const next = toks[i + 1];
    out[t.slice(2)] = next && !next.startsWith('--') ? toks[++i] : true;
  }
  return out;
}

async function runTask(btn) {
  const box = btn.closest('.task');
  if (box.classList.contains('busy') && !confirm('这个任务已经在跑了，再起一次？')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ task: btn.dataset.run, args: parseArgs(box.querySelector('input').value) })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error === 'local_only' ? '只有本机能起任务（viewer 设 MIWORKFLOW_REMOTE_RUN=1 放开）' : `起不来：${data.error}`);
      return;
    }
    await select(data.runId);
  } finally {
    btn.disabled = false;
  }
}

function renderPending() {
  $('#pending').innerHTML = pendingList().map((p) => `
    <div class="card">
      <h3>需要你决定 · seq ${p.seq} · ${time(p.at)}</h3>
      <p>${esc(p.prompt)}</p>
      <button class="yes" data-seq="${p.seq}" data-d="ok">通过</button>
      <button class="no" data-seq="${p.seq}" data-d="skipped">拒绝</button>
    </div>`).join('');
}

// ── Agent 过程（§10.1）：events 指回 logs/<runId>/agent-<n>.events.jsonl，点开才拉 ──
const clip = (s, n) => {
  const t = String(s ?? '').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
};

// events 字段："<runId>/agent-<n>.events.jsonl"
function parseEventsPath(p) {
  const m = String(p ?? '').match(/^(.*)\/agent-(\d+)\.events\.jsonl$/);
  return m ? { runId: m[1], n: m[2] } : null;
}

function argBrief(args) {
  if (args == null) return '';
  if (typeof args !== 'object') return clip(args, 100);
  const what = args.command ?? args.path ?? args.file_path ?? args.pattern ?? args.query ?? args.url ?? args.description;
  if (what != null) return clip(Array.isArray(what) ? what.join(' ') : what, 100);
  try { return clip(JSON.stringify(args), 100); } catch { return ''; }
}

function resultBrief(result) {
  if (result == null) return '';
  if (typeof result !== 'object') return clip(result, 140);
  const bits = [];
  if (result.exit_code != null || result.exitCode != null) bits.push('exit ' + (result.exit_code ?? result.exitCode));
  const text = result.output ?? result.stdout ?? result.text ?? result.content ?? result.error;
  if (text != null) bits.push(Array.isArray(text) ? text.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ') : String(text));
  return bits.length ? clip(bits.join(' · '), 160) : '';
}

// 同一次工具调用的 start / done 合成一行；其余（outcome / raw / *_partial）折不刷屏
function foldEvents(items) {
  const lines = [];
  const byCall = new Map();
  let folded = 0;
  for (const ev of Array.isArray(items) ? items : []) {
    const kind = String(ev?.kind ?? 'raw');
    if (kind === 'tool') {
      // 有 callId 就按调用配对；没有（有些 CLI 不给）就把同名工具的上一条当同一次
      const key = ev.callId || `name:${ev.toolName ?? 'tool'}`;
      const hit = byCall.get(key);
      if (ev.phase === 'done' && hit) {
        if (ev.result !== undefined) hit.result = ev.result;
        continue;
      }
      const line = { kind: 'tool', toolName: ev.toolName ?? 'tool', args: ev.args, result: ev.phase === 'done' ? ev.result : undefined };
      byCall.set(key, line);
      lines.push(line);
    } else if (kind === 'assistant' || kind === 'thinking' || kind === 'error') {
      if (ev.text) lines.push({ kind, text: ev.text });
    } else {
      folded++;
    }
  }
  return { lines, folded };
}

// 流式 / 原始事件一次 agent 能出上万条（events.jsonl 上到 10MB），HTML 里只塞末尾一小截，
// 否则 renderTimeline 的 innerHTML 直接卡死；完整原文在 logs/<runId>/agent-<n>.events.jsonl。
const PRE_MAX = 200;
const PRE_CHARS = 20000;

function foldedHtml(rest, folded) {
  if (!folded) return '';
  const tail = rest.slice(-PRE_MAX);
  const lines = [];
  let chars = 0;
  for (const ev of tail) {
    let line;
    try { line = JSON.stringify(ev) ?? String(ev); } catch { line = '[无法序列化]'; }
    if (chars + line.length > PRE_CHARS) break;
    chars += line.length;
    lines.push(line);
  }
  const cut = folded > lines.length ? `（只示末尾 ${lines.length} 条）` : '';
  return `<details><summary>另有 ${folded} 条流式 / 原始事件${cut}</summary>`
    + `<pre>${esc(lines.join('\n'))}</pre></details>`;
}

function renderEvents(st) {
  if (st.error) return `<div class="evt-none">读不到过程：${esc(st.error)}</div>`;
  if (st.items == null) return '<div class="evt-none">读取中…</div>';
  const { lines, folded } = foldEvents(st.items);
  if (!lines.length && !folded) return `<div class="evt-none">${st.done ? '这一步还没有过程记录' : '进行中…'}</div>`;
  const html = lines.map((l) => {
    if (l.kind === 'tool') {
      const res = l.result !== undefined ? resultBrief(l.result) : '';
      return `<div class="line">· ${esc(l.toolName)} ${esc(argBrief(l.args))}`
        + (res ? `<div class="line l-res">→ ${esc(res)}</div>` : '') + '</div>';
    }
    if (l.kind === 'assistant') return `<div class="line">» ${esc(clip(l.text, 2000))}</div>`;
    if (l.kind === 'thinking') return `<div class="line l-thinking">… ${esc(clip(l.text, 1000))}</div>`;
    return `<div class="line l-error">✖ ${esc(clip(l.text, 2000))}</div>`;
  }).join('');
  const rest = (Array.isArray(st.items) ? st.items : [])
    .filter((ev) => !['tool', 'assistant', 'thinking', 'error'].includes(String(ev?.kind ?? 'raw')));
  return html + foldedHtml(rest, folded);
}

function renderTimeline() {
  if (!records.length) { $('#timeline').innerHTML = '<li class="empty">等待中…</li>'; return; }
  $('#timeline').innerHTML = records.map((r) => {
    const open = isOpen(r);
    const detail = [r.reason, r.error].filter(Boolean).join('\n');
    const meta = [r.name, r.status, r.durationMs != null ? r.durationMs + 'ms' : null, time(r.at)]
      .filter(Boolean).map(esc).join(' · ');
    const st = agentEvents.get(r.seq) ?? { open: false };
    const ev = r.events ? parseEventsPath(r.events) : null;
    // 过程按钮挂在 running 行（带 ref 的终态行不再重复一个按钮指同一份文件）
    const evHtml = ev && r.ref == null
      ? `<div class="evt"><button data-ev="${r.seq}">过程 ${st.open ? '▾' : '▸'}</button>`
        + (st.open ? `<div class="evt-body">${renderEvents(st)}</div>` : '') + '</div>'
      : '';
    const active = isActive(r);
    // 「进行中 / 已结束」只属于 agent 的进行中记录：run 的那条 status:'running' 是运行开始，不是步骤（§13.1）
    const runningAgent = r.primitive === 'agent' && r.status === 'running';
    return `<li class="row ${open ? 'open' : ''} ${runningAgent && !active ? 'resolved' : ''}" data-seq="${r.seq ?? ''}">
      <span class="sq">${r.seq ?? ''}</span>
      <span class="badge ${esc(r.status ?? '')}">${esc(r.primitive ?? '')}</span>
      <div>
        <div class="say"><span class="chev">${open ? '▾' : '▸'}</span>${esc(r.say ?? '')}${runningAgent ? `<span class="pill running">${active ? '进行中' : '已结束'}</span>` : ''}</div>
        <div class="meta">${meta}</div>
        ${open && detail ? `<div class="detail">${esc(detail)}</div>` : ''}
        ${open ? evHtml : ''}
      </div>
    </li>`;
  }).join('');
}

async function select(id) {
  cur = id; offset = 0; records = []; decided.clear(); agentEvents.clear(); manual.clear();
  renderRuns(); renderTimeline(); renderPending();
  await pump();
}

async function pump() {
  if (!cur) return;
  try {
    const res = await fetch(`/api/run/${encodeURIComponent(cur)}?from=${offset}`);
    const data = await res.json();
    offset = data.next;
    if (data.records.length) {
      records.push(...data.records);
      renderTimeline(); renderPending();
    }
    await pollEvents(); // 展开着的「过程」跟着轮询长
    $('#conn').textContent = '已连接 · ' + new Date().toLocaleTimeString('zh-CN', { hour12:false });
  } catch {
    $('#conn').textContent = '连接断开';
  }
}

async function tick() {
  try {
    runs = await (await fetch('/api/runs')).json();
    renderRuns();
    renderTasks(await (await fetch('/api/tasks')).json());
    if (!cur && runs.length) await select(runs[0].runId);
  } catch {
    $('#conn').textContent = '连接断开';
  }
}

function evtState(seq) {
  let st = agentEvents.get(seq);
  if (!st) { st = { open: false, items: null, next: 0, loading: false, error: null, done: false }; agentEvents.set(seq, st); }
  return st;
}

// 增量拉：服务端按字节吐 { next, items }，半行留到下次；失败可重试（下一次轮询再来）
async function loadEvents(seq) {
  const st = evtState(seq);
  if (st.loading || st.done) return;
  const rec = records.find((r) => r.seq === seq);
  const target = rec ? parseEventsPath(rec.events) : null;
  if (!target) { st.error = 'events 字段不对'; renderTimeline(); return; }
  st.error = null;
  st.loading = true;
  if (st.items == null) { st.items = []; renderTimeline(); }
  try {
    const from = st.next ?? 0;
    const res = await fetch(`/api/run/${encodeURIComponent(target.runId)}/events/${encodeURIComponent(target.n)}?from=${from}`);
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    st.next = data.next ?? from;
    // 用 concat 而不是 push(...)：一次能拉回上万条，spread 参数会爆栈（events.jsonl 上 10MB）
    if (data.items?.length) st.items = st.items.concat(data.items);
  } catch (err) {
    st.error = String(err?.message ?? err);
  } finally {
    st.loading = false;
    renderTimeline();
  }
}

// 点「过程 ▸」展开；状态重画不丢，已读的续读不重拉
async function toggleEvents(seq) {
  const st = evtState(seq);
  st.open = !st.open;
  renderTimeline();
  if (st.open && st.items == null) await loadEvents(seq);
}

// 跟着 1 秒轮询刷新：进行中的步骤一直续读，到终态后再拉一次就停
async function pollEvents() {
  for (const [seq, st] of [...agentEvents]) {
    if (!st.open || st.done || st.loading) continue;
    const rec = records.find((r) => r.seq === seq);
    if (!rec) continue;
    const active = isActive(rec);
    await loadEvents(seq);
    if (!active) st.done = true;
  }
}

document.addEventListener('click', async (e) => {
  const evBtn = e.target.closest('button[data-ev]');
  if (evBtn) return toggleEvents(Number(evBtn.dataset.ev));
  const go = e.target.closest('button[data-run]');
  if (go) return runTask(go);
  const btn = e.target.closest('button[data-seq]');
  if (btn) {
    btn.disabled = true;
    await fetch('/api/decide', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ runId: cur, seq: Number(btn.dataset.seq), decision: btn.dataset.d })
    });
    decided.add(Number(btn.dataset.seq));
    renderPending();
    return;
  }
  const item = e.target.closest('.run');
  if (item && item.dataset.id !== cur) return select(item.dataset.id);
  // 点整行展开 / 收起详情；点过程区（按钮、事件正文）不收起
  const row = e.target.closest('li[data-seq]');
  if (row && !e.target.closest('.evt')) {
    const seq = Number(row.dataset.seq);
    const rec = records.find((r) => r.seq === seq);
    if (rec) { manual.set(seq, !isOpen(rec)); renderTimeline(); }
  }
});

document.addEventListener('change', (e) => {
  if (e.target?.id === 'expandAll') setExpandAll(e.target.checked);
});

$('#expandAll').checked = expandAll;
setInterval(tick, 2000);
setInterval(pump, 1000);
tick();
</script>
</body>
</html>
